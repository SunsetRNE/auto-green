# ============================================================
# 智能绿墙-图案完全体（重构修复版）
# 功能：三种模式控制贡献图
#   1) 过去提交填充模式：按颜色级别回填过去日期
#   2) 未来重复提交模式：未来每天按颜色级别重复提交
#   3) 未来图案提交模式：按图案码（0-4）绘制贡献图图案
# 触发：Actions 页面手动触发（workflow_dispatch）
# ============================================================
name: 智能绿墙-图案完全体

on:
  workflow_dispatch:
    inputs:
      git_user_name:
        description: 您的Git用户名
        required: true
        default: ''
      git_user_email:
        description: 您的Git邮箱（需在GitHub验证）
        required: true
        default: ''
      github_username:
        description: 您的GitHub用户名（若勾选"从账号创建开始"则必须填写）
        required: false
        default: ''
      mode:
        description: 选择填充模式
        required: true
        default: '过去提交填充模式'
        type: choice
        options:
          - '过去提交填充模式'
          - '未来重复提交填充模式'
          - '未来图案提交填充模式'
      start_date:
        description: 开始日期 (YYYY-MM-DD)，留空则自动计算
        required: false
        default: ''
      end_date:
        description: 结束日期 (YYYY-MM-DD)，留空则根据模式自动计算（过去模式默认昨天，未来模式默认今天起30天）
        required: false
        default: ''
      from_account_creation:
        description: 从账号创建日期开始回填（仅对过去模式有效）
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      color_level:
        description: 颜色级别（适用于过去模式和未来重复模式）
        required: false
        default: '浅绿'
        type: choice
        options:
          - '浅绿'
          - '中绿'
          - '深绿'
          - '更深绿'
          - '随机'
          - '空白'
      pattern_code:
        description: |
          图案码（仅对未来图案模式有效）：
          0=空白，1=浅绿，2=中绿，3=深绿，4=更深绿
          可输入多行，脚本会去除换行和空格后循环使用
          例如：
          1111111
          1222221
          1233321
          1234321
          1233321
          1222221
          1111111
        required: false
        default: ''
      delay_strategy:
        description: 延缓提交速度策略
        required: false
        default: '无'
        type: choice
        options:
          - '无'
          - '轻度'
          - '中度'
          - '重度'
      dry_run:
        description: 仅测试运行，不实际推送
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_push:
        description: 是否强制推送 (--force-with-lease)？慎用！
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装必要工具 (jq)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 配置Git用户
        run: |
          git config user.name "${{ github.event.inputs.git_user_name }}"
          git config user.email "${{ github.event.inputs.git_user_email }}"

      - name: 检查邮箱是否已验证
        run: |
          echo "请确保邮箱 ${{ github.event.inputs.git_user_email }} 已在 GitHub 验证"
          echo "验证地址：https://github.com/settings/emails"

      - name: 获取账号创建日期
        id: account_creation
        if: github.event.inputs.from_account_creation == 'true'
        run: |
          USERNAME="${{ github.event.inputs.github_username }}"
          if [[ -z "$USERNAME" ]]; then
            echo "❌ 未提供用户名"
            exit 1
          fi
          USER_INFO=$(curl -s "https://api.github.com/users/$USERNAME")
          CREATED_AT=$(echo "$USER_INFO" | jq -r '.created_at')
          if [[ "$CREATED_AT" == "null" ]]; then
            echo "❌ 无法获取创建时间"
            exit 1
          fi
          CREATED_DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)
          echo "creation_date=$CREATED_DATE" >> "$GITHUB_OUTPUT"

      - name: 计算日期范围
        id: dates
        run: |
          MODE="${{ github.event.inputs.mode }}"
          # 确定开始日期
          if [[ "${{ github.event.inputs.from_account_creation }}" == "true" && "$MODE" == "过去提交填充模式" ]]; then
            START="${{ steps.account_creation.outputs.creation_date }}"
          elif [[ -n "${{ github.event.inputs.start_date }}" ]]; then
            START="${{ github.event.inputs.start_date }}"
          else
            if [[ "$MODE" == "过去提交填充模式" ]]; then
              START=$(date -d "1 year ago" +%Y-%m-%d)
            else
              START=$(date -d "today" +%Y-%m-%d)
            fi
          fi
          # 确定结束日期
          if [[ -n "${{ github.event.inputs.end_date }}" ]]; then
            END="${{ github.event.inputs.end_date }}"
          else
            if [[ "$MODE" == "过去提交填充模式" ]]; then
              END=$(date -d "yesterday" +%Y-%m-%d)
            else
              END=$(date -d "today + 30 days" +%Y-%m-%d)
            fi
          fi
          date -d "$START" >/dev/null 2>&1 || { echo "无效开始日期"; exit 1; }
          date -d "$END" >/dev/null 2>&1 || { echo "无效结束日期"; exit 1; }
          if [[ "$START" > "$END" ]]; then
            echo "开始日期不能晚于结束日期"
            exit 1
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: 生成提交
        id: generate
        run: |
          MODE="${{ github.event.inputs.mode }}"
          START="${{ steps.dates.outputs.start }}"
          END="${{ steps.dates.outputs.end }}"
          LEVEL="${{ github.event.inputs.color_level }}"
          PATTERN_RAW="${{ github.event.inputs.pattern_code }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          DELAY="${{ github.event.inputs.delay_strategy }}"

          # 预处理图案码（仅未来图案模式需要）
          if [[ "$MODE" == "未来图案提交填充模式" ]]; then
            PATTERN=$(echo "$PATTERN_RAW" | tr -d '\n' | tr -d ' ')
            if [[ -z "$PATTERN" ]]; then
              echo "❌ 未来图案模式必须提供图案码"
              exit 1
            fi
            PATTERN_LEN=${#PATTERN}
          fi

          total_days=0
          updated_days=0
          skipped_days=0
          future_blank_days=0
          current="$START"
          day_index=0

          while [[ "$current" != $(date -d "$END + 1 day" +%Y-%m-%d) ]]; do
            total_days=$((total_days + 1))
            commit_count=$(git log --after="$current 00:00:00" --before="$current 23:59:59" --oneline 2>/dev/null | wc -l)

            # 确定目标级别范围
            if [[ "$MODE" == "未来图案提交填充模式" ]]; then
              idx=$(( day_index % PATTERN_LEN ))
              ch="${PATTERN:$idx:1}"
              case "$ch" in
                0) min=0; max=0 ;;
                1) min=1; max=3 ;;
                2) min=4; max=6 ;;
                3) min=7; max=9 ;;
                4) min=10; max=15 ;;
                *)
                  echo "警告：图案码包含非法字符 '$ch'，视为1"
                  min=1; max=3 ;;
              esac
            else
              # 过去或未来重复模式，根据颜色级别确定
              case "$LEVEL" in
                浅绿) min=1; max=3 ;;
                中绿) min=4; max=6 ;;
                深绿) min=7; max=9 ;;
                更深绿) min=10; max=15 ;;
                随机)
                  r=$((RANDOM % 4))
                  [ $r -eq 0 ] && { min=1; max=3; }
                  [ $r -eq 1 ] && { min=4; max=6; }
                  [ $r -eq 2 ] && { min=7; max=9; }
                  [ $r -eq 3 ] && { min=10; max=15; }
                  ;;
                空白) min=0; max=0 ;;
              esac
            fi

            # 处理目标空白但已有提交的情况
            if [[ $min -eq 0 && $commit_count -gt 0 ]]; then
              if [[ "$MODE" != "过去提交填充模式" ]]; then
                echo "日期 $current 已有提交，目标为空白；未来日期将推迟空白需求"
                future_blank_days=$((future_blank_days + 1))
              else
                echo "日期 $current 已有提交，目标为空白；过去模式无法推迟，跳过该天"
              fi
              skipped_days=$((skipped_days + 1))
              day_index=$((day_index + 1))
              current=$(date -d "$current + 1 day" +%Y-%m-%d)
              continue
            fi

            # 如果已有提交已达到目标下限，则跳过
            if [[ $commit_count -ge $min ]]; then
              echo "日期 $current 已有 $commit_count 次提交，满足要求"
              skipped_days=$((skipped_days + 1))
              day_index=$((day_index + 1))
              current=$(date -d "$current + 1 day" +%Y-%m-%d)
              continue
            fi

            # 需要补充提交
            target=$(( RANDOM % (max - min + 1) + min ))
            needed=$(( target - commit_count ))
            echo "日期 $current 需要补充 $needed 次提交"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "干运行：将生成 $needed 次提交"
            else
              for ((i=1; i<=needed; i++)); do
                hour=$(( (i * 2) % 24 ))
                minute=$(( i * 3 % 60 ))
                second=$(( i * 7 % 60 ))
                commit_time="$current $hour:$minute:$second"
                echo "Backfill commit on $current" >> activity.log
                git add activity.log
                git commit --date="$commit_time" -m "chore: backfill $current"
                echo "已生成提交 $commit_time"
                case "$DELAY" in
                  轻度) sleep 0.2 ;;
                  中度) sleep 0.5 ;;
                  重度) sleep 1 ;;
                esac
              done
              updated_days=$((updated_days + 1))
            fi
            day_index=$((day_index + 1))
            current=$(date -d "$current + 1 day" +%Y-%m-%d)
          done

          echo "统计：总天数 $total_days，已达标跳过 $skipped_days，补充更新 $updated_days，推迟空白 $future_blank_days"
          echo "updated=$updated_days" >> "$GITHUB_OUTPUT"

      - name: 推送更改
        if: github.event.inputs.dry_run == 'false' && steps.generate.outputs.updated > 0
        run: |
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          if [[ "${{ github.event.inputs.force_push }}" == "true" ]]; then
            git push --force-with-lease origin "$BRANCH"
          else
            git push origin "$BRANCH" || { echo "推送失败，建议启用强制推送"; exit 1; }
          fi

      - name: 无更新跳过推送
        if: github.event.inputs.dry_run == 'false' && steps.generate.outputs.updated == 0
        run: echo "无需推送"

      - name: 完成提示
        if: always()
        run: echo "工作流执行完毕，请查看贡献图"