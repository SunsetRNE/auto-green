name: Backfill Contributions (Public Template)

on:
  workflow_dispatch:
    inputs:
      github_username:
        description: '你的 GitHub 用户名（用于获取账号创建日期）'
        required: true
        type: string
      verified_email:
        description: '已在 GitHub 验证的邮箱（提交将计入贡献图）'
        required: true
        type: string
      git_author_name:
        description: 'Git 提交者名称（可选，默认使用 GitHub 用户名）'
        required: false
        type: string
      start_date:
        description: '开始日期 YYYY-MM-DD（可选，默认1年前，若勾选“从账号创建开始”则忽略）'
        required: false
        type: string
      end_date:
        description: '结束日期 YYYY-MM-DD（可选，默认昨天）'
        required: false
        type: string
      from_account_creation:
        description: '从账号创建日期开始回填（将忽略 start_date）'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '仅测试运行，不实际生成和推送提交'
        required: false
        type: boolean
        default: false
      force_push:
        description: '强制推送 --force-with-lease（慎用！仅当你是仓库唯一作者）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，以便检测已有提交

      - name: 安装必要工具 (jq)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 配置 Git 用户
        run: |
          AUTHOR_NAME="${{ github.event.inputs.git_author_name }}"
          if [ -z "$AUTHOR_NAME" ]; then
            AUTHOR_NAME="${{ github.event.inputs.github_username }}"
          fi
          git config user.name "$AUTHOR_NAME"
          git config user.email "${{ github.event.inputs.verified_email }}"
          echo "✅ Git 配置完成：$(git config user.name) <$(git config user.email)>"
          echo "⚠️ 重要提醒：请确保邮箱 ${{ github.event.inputs.verified_email }} 已在 https://github.com/settings/emails 中验证，否则贡献不会被计入。"

      - name: 获取账号创建日期（如果用户勾选了“从账号创建开始”）
        id: account_creation
        if: github.event.inputs.from_account_creation == true
        run: |
          USERNAME="${{ github.event.inputs.github_username }}"
          echo "正在获取用户 ${USERNAME} 的创建日期..."
          # 使用 GITHUB_TOKEN 提高 API 限流（5000次/小时）
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/${USERNAME}")
          CREATED_AT=$(echo "$RESPONSE" | jq -r '.created_at')
          if [ "$CREATED_AT" == "null" ] || [ -z "$CREATED_AT" ]; then
            echo "❌ 无法获取账号创建时间，请检查用户名是否正确。"
            echo "API 响应摘要：$(echo "$RESPONSE" | jq -c '{message: .message, login: .login}')"
            exit 1
          fi
          CREATED_DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)
          echo "📅 账号创建日期：$CREATED_DATE"
          echo "creation_date=$CREATED_DATE" >> $GITHUB_OUTPUT

      - name: 计算日期范围
        id: dates
        run: |
          if [ "${{ github.event.inputs.from_account_creation }}" == "true" ]; then
            START="${{ steps.account_creation.outputs.creation_date }}"
            if [ -z "$START" ]; then
              echo "❌ 未获取到账号创建日期，请检查上一步。"
              exit 1
            fi
          else
            if [ -n "${{ github.event.inputs.start_date }}" ]; then
              START="${{ github.event.inputs.start_date }}"
            else
              START=$(date -d "1 year ago" +%Y-%m-%d)
            fi
          fi

          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            END="${{ github.event.inputs.end_date }}"
          else
            END=$(date -d "yesterday" +%Y-%m-%d)
          fi

          # 严格验证日期格式
          if ! date -d "$START" >/dev/null 2>&1; then
            echo "❌ 无效的开始日期：$START"
            exit 1
          fi
          if ! date -d "$END" >/dev/null 2>&1; then
            echo "❌ 无效的结束日期：$END"
            exit 1
          fi
          if [[ "$START" > "$END" ]]; then
            echo "❌ 开始日期不能晚于结束日期"
            exit 1
          fi

          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT
          echo "📅 最终日期范围：$START 至 $END"

      - name: 生成缺失日期的提交（智能跳过已有提交）
        id: generate
        run: |
          START="${{ steps.dates.outputs.start }}"
          END="${{ steps.dates.outputs.end }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          AUTHOR_EMAIL="${{ github.event.inputs.verified_email }}"

          TOTAL_DAYS=0
          MISSING_DAYS=0
          CURRENT="$START"

          # 创建一个用于记录回填的文件（避免空提交）
          BACKFILL_FILE="backfill.log"
          touch "$BACKFILL_FILE"

          while true; do
            # 将 CURRENT 转为时间戳进行比较（兼容不同日期格式）
            CURRENT_TS=$(date -d "$CURRENT" +%s 2>/dev/null || echo "")
            END_TS=$(date -d "$END" +%s)
            if [ -z "$CURRENT_TS" ] || [ "$CURRENT_TS" -gt "$END_TS" ]; then
              break
            fi

            TOTAL_DAYS=$((TOTAL_DAYS + 1))
            echo -n "🔍 检查日期 $CURRENT ... "

            # 检查该日期是否已有当前作者的提交（使用邮箱精确匹配）
            COMMIT_COUNT=$(git log --author="$AUTHOR_EMAIL" \
              --after="$CURRENT 00:00:00" --before="$CURRENT 23:59:59" \
              --oneline 2>/dev/null | wc -l)

            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "✅ 已有 $COMMIT_COUNT 次提交，跳过"
            else
              MISSING_DAYS=$((MISSING_DAYS + 1))
              echo "❌ 无提交，需要生成"
              if [ "$DRY_RUN" != "true" ]; then
                # 生成有意义的内容（避免垃圾提交被 GitHub 风控）
                echo "[$CURRENT] Backfilled at $(date -R)" >> "$BACKFILL_FILE"
                git add "$BACKFILL_FILE"
                if git commit --date="$CURRENT 12:00:00" -m "chore(backfill): add contribution for $CURRENT"; then
                  echo "   ✅ 已生成提交 $CURRENT"
                else
                  echo "   ⚠️ 提交失败（可能该日期已有其他提交？但检查未发现），跳过"
                fi
              else
                echo "   (干运行) 将生成提交 $CURRENT"
              fi
            fi

            # 移动到下一天
            CURRENT=$(date -I -d "$CURRENT + 1 day")
          done

          echo "📊 统计：总天数 $TOTAL_DAYS，缺失天数 $MISSING_DAYS"
          echo "missing=$MISSING_DAYS" >> $GITHUB_OUTPUT

          # 如果是干运行，输出提示
          if [ "$DRY_RUN" == "true" ]; then
            echo "⚠️ 当前为干运行模式，未实际生成任何提交。"
          fi

      - name: 推送更改（非干运行且有新提交时）
        if: github.event.inputs.dry_run == false && steps.generate.outputs.missing != '0'
        run: |
          BRANCH="${{ github.ref_name }}"
          FORCE="${{ github.event.inputs.force_push }}"
          echo "准备推送到分支：$BRANCH"
          git fetch origin "$BRANCH"

          if [ "$FORCE" == "true" ]; then
            echo "⚠️ 使用 --force-with-lease 强制推送（将重写历史）"
            git push --force-with-lease origin "HEAD:$BRANCH"
          else
            echo "尝试普通推送..."
            if git push origin "HEAD:$BRANCH"; then
              echo "✅ 推送成功"
            else
              echo "❌ 推送失败，可能是远程分支有新提交。"
              echo "解决方案："
              echo "1. 如果确认要覆盖远程历史，请重新运行并勾选 force_push"
              echo "2. 如果有其他协作者，请先协调"
              exit 1
            fi
          fi

      - name: 无新提交时跳过推送
        if: github.event.inputs.dry_run == false && steps.generate.outputs.missing == '0'
        run: echo "✅ 没有发现缺失的日期，无需推送。"

      - name: 最终提示
        if: always()
        run: |
          echo "🎉 工作流执行完毕"
          echo "📌 提示：贡献图可能需要几分钟到一小时才能刷新。"
          echo "📌 如果贡献未显示，请确认邮箱已验证且提交的作者邮箱匹配。"
