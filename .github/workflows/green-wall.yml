name: Backfill Contributions (Smart + Public API + Green Wall)

on:
  workflow_dispatch:
    inputs:
      git_user_name:
        description: '您的Git用户名'
        required: true
        default: ''
      git_user_email:
        description: '您的Git邮箱（需在GitHub验证）'
        required: true
        default: ''
      github_username:
        description: '您的GitHub用户名（若勾选“从账号创建开始”则必须填写）'
        required: false
        default: ''
      start_date:
        description: '开始日期 (YYYY-MM-DD)，留空则自动计算'
        required: false
        default: ''
      end_date:
        description: '结束日期 (YYYY-MM-DD)，留空则自动计算为昨天（若启用未来模式可填未来日期）'
        required: false
        default: ''
      from_account_creation:
        description: '从账号创建日期开始回填（将忽略 start_date，且必须填写用户名）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      future_mode:
        description: '允许处理未来日期（提交日期可设置为未来）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      green_level:
        description: '贡献格颜色控制'
        required: false
        default: 'light'
        type: choice
        options:
          - 'light'
          - 'medium'
          - 'dark'
          - 'darker'
          - 'random'
          - 'blank'
      delay_strategy:
        description: '延缓提交速度策略'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'light'
          - 'moderate'
          - 'heavy'
      dry_run:
        description: '仅测试运行，不实际推送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_push:
        description: '是否强制推送 (--force-with-lease)？慎用！'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "${{ github.event.inputs.git_user_name }}"
          git config user.email "${{ github.event.inputs.git_user_email }}"

      - name: 检查邮箱是否已验证
        run: |
          echo "请确保邮箱 ${{ github.event.inputs.git_user_email }} 已在 GitHub 验证"
          echo "验证地址：https://github.com/settings/emails"

      - name: 获取账号创建日期
        id: account_creation
        if: github.event.inputs.from_account_creation == 'true'
        run: |
          USERNAME="${{ github.event.inputs.github_username }}"
          if [[ -z "$USERNAME" ]]; then
            echo "❌ 未提供用户名"
            exit 1
          fi
          USER_INFO=$(curl -s "https://api.github.com/users/$USERNAME")
          CREATED_AT=$(echo "$USER_INFO" | jq -r '.created_at')
          if [[ "$CREATED_AT" == "null" ]]; then
            echo "❌ 无法获取创建时间"
            exit 1
          fi
          CREATED_DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)
          echo "creation_date=$CREATED_DATE" >> $GITHUB_OUTPUT

      - name: 计算日期范围
        id: dates
        run: |
          if [[ "${{ github.event.inputs.from_account_creation }}" == "true" ]]; then
            START="${{ steps.account_creation.outputs.creation_date }}"
          elif [[ -n "${{ github.event.inputs.start_date }}" ]]; then
            START="${{ github.event.inputs.start_date }}"
          else
            START=$(date -d "1 year ago" +%Y-%m-%d)
          fi

          if [[ -n "${{ github.event.inputs.end_date }}" ]]; then
            END="${{ github.event.inputs.end_date }}"
          elif [[ "${{ github.event.inputs.future_mode }}" == "true" ]]; then
            END=$(date -d "today" +%Y-%m-%d)
          else
            END=$(date -d "yesterday" +%Y-%m-%d)
          fi

          date -d "$START" >/dev/null 2>&1 || { echo "无效开始日期"; exit 1; }
          date -d "$END" >/dev/null 2>&1 || { echo "无效结束日期"; exit 1; }
          if [[ "$START" > "$END" ]]; then
            echo "开始日期不能晚于结束日期"
            exit 1
          fi
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT

      - name: 生成提交
        id: generate
        run: |
          START="${{ steps.dates.outputs.start }}"
          END="${{ steps.dates.outputs.end }}"
          LEVEL="${{ github.event.inputs.green_level }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          DELAY="${{ github.event.inputs.delay_strategy }}"
          FUTURE="${{ github.event.inputs.future_mode }}"

          total_days=0
          updated_days=0
          skipped_days=0
          future_blank_days=0
          declare -a future_dates

          current="$START"
          while [[ "$current" != $(date -d "$END + 1 day" +%Y-%m-%d) ]]; do
            total_days=$((total_days + 1))
            commit_count=$(git log --after="$current 00:00:00" --before="$current 23:59:59" --oneline 2>/dev/null | wc -l)

            case "$LEVEL" in
              light) min=1; max=3 ;;
              medium) min=4; max=6 ;;
              dark) min=7; max=9 ;;
              darker) min=10; max=15 ;;
              random) r=$((RANDOM % 4)); [ $r -eq 0 ] && { min=1; max=3; }; [ $r -eq 1 ] && { min=4; max=6; }; [ $r -eq 2 ] && { min=7; max=9; }; [ $r -eq 3 ] && { min=10; max=15; } ;;
              blank) min=0; max=0 ;;
            esac

            if [[ "$LEVEL" == "blank" && $commit_count -gt 0 ]]; then
              if [[ "$FUTURE" == "true" ]]; then
                echo "日期 $current 已有提交，将空白需求推迟到未来第一天"
                future_dates+=("$current")
                future_blank_days=$((future_blank_days + 1))
                skipped_days=$((skipped_days + 1))
                current=$(date -d "$current + 1 day" +%Y-%m-%d)
                continue
              else
                echo "日期 $current 已有提交，无法变为空白，跳过"
                skipped_days=$((skipped_days + 1))
                current=$(date -d "$current + 1 day" +%Y-%m-%d)
                continue
              fi
            fi

            if [[ $commit_count -ge $min ]]; then
              echo "日期 $current 已有 $commit_count 次提交，满足要求"
              skipped_days=$((skipped_days + 1))
              current=$(date -d "$current + 1 day" +%Y-%m-%d)
              continue
            fi

            target=$(( RANDOM % (max - min + 1) + min ))
            needed=$(( target - commit_count ))
            echo "日期 $current 需要补充 $needed 次提交"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "干运行：将生成 $needed 次提交"
            else
              for ((i=1; i<=needed; i++)); do
                hour=$(( (i * 2) % 24 ))
                minute=$(( i * 3 % 60 ))
                second=$(( i * 7 % 60 ))
                commit_time="$current $hour:$minute:$second"
                echo "Backfill commit on $current" >> activity.log
                git add activity.log
                git commit --date="$commit_time" -m "chore: backfill $current"
                echo "已生成提交 $commit_time"
                case "$DELAY" in
                  light) sleep 0.2 ;;
                  moderate) sleep 0.5 ;;
                  heavy) sleep 1 ;;
                esac
              done
              updated_days=$((updated_days + 1))
            fi

            current=$(date -d "$current + 1 day" +%Y-%m-%d)
          done

          if [[ $future_blank_days -gt 0 ]]; then
            echo "需要为 $future_blank_days 天未来空白生成提交（将设置为空白）"
            if [[ "$DRY_RUN" != "true" ]]; then
              future_start=$(date -d "$END + 1 day" +%Y-%m-%d)
              for ((j=0; j<future_blank_days; j++)); do
                fd=$(date -d "$future_start + $j day" +%Y-%m-%d)
                echo "未来日期 $fd 设置为空白（无提交）"
              done
            fi
          fi

          echo "统计：总天数 $total_days，已达标跳过 $skipped_days，补充更新 $updated_days，推迟空白 $future_blank_days"
          echo "updated=$updated_days" >> $GITHUB_OUTPUT

      - name: 推送更改
        if: github.event.inputs.dry_run == 'false' && steps.generate.outputs.updated > 0
        run: |
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          if [[ "${{ github.event.inputs.force_push }}" == "true" ]]; then
            git push --force-with-lease origin "$BRANCH"
          else
            git push origin "$BRANCH" || { echo "推送失败，建议启用强制推送"; exit 1; }
          fi

      - name: 无更新跳过推送
        if: github.event.inputs.dry_run == 'false' && steps.generate.outputs.updated == 0
        run: echo "无需推送"

      - name: 完成提示
        if: always()
        run: echo "工作流执行完毕，请查看贡献图"
